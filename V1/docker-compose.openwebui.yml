version: "3.9"

services:
  # Open WebUI para interacción con Ollama externo
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: deepwiki_openwebui
    ports:
      - "3000:8080"
    volumes:
      - ./data/openwebui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_SECRET_KEY=deepwiki-secret-key-2024
      - WEBUI_NAME=DeepWiki ChatUI
      - DEFAULT_USER_ROLE=user
    restart: unless-stopped
    networks:
      - deepwiki
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  deepwiki:
    driver: bridge
    external: true
