$schema: "http://json-schema.org/draft-07/schema#"
title: "Manifest del corpus vectorial"
type: object
required: [nick, proyecto, mod, banner, source_root, sources, palette, export]
properties:
  nick:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
    description: "Identificador corto en minúsculas (sin espacios). Ej: 'mapas'."
  proyecto:
    type: string
    description: "Nombre completo del proyecto. Ej: 'MAPAS_DE_SINGULARIDAD'."
  mod:
    type: string
    description: "Tenant/database lógico. Determina la database en Chroma (mod-{mod})."
  banner:
    type: string
    enum: [azul, negro, rojo]
    description: "Banner cromático que determina paleta defaults y ruta de export."
  source_root:
    type: string
    description: "Ruta relativa (desde el repo root) al directorio que contiene los .md fuente."
  sources:
    type: array
    minItems: 1
    items:
      type: object
      required: [file, short_id, collection_suffix, label]
      properties:
        file:
          type: string
          description: "Nombre del archivo .md dentro de source_root."
        short_id:
          type: string
          description: "Prefijo de IDs de chunks dentro de Chroma. Ej: 'mco-01'."
        collection_suffix:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: "Sufijo de la colección. La colección final es m{mod[0]}_{nick}_{collection_suffix}."
        label:
          type: string
          description: "Etiqueta humana para visualización. Ej: 'Corpus [MS]'."
        bloque:
          type: string
          description: "metadata.bloque para los chunks de esta fuente. Si se omite, el generador puede derivarlo del orden o nombre del archivo."
        tipo:
          type: string
          description: "metadata.tipo para los chunks de esta fuente. Si se omite, el generador puede derivarlo del collection_suffix."
        summary:
          type: string
          description: "Resumen humano para el header markdown de la fuente en el notebook ingestor."
  palette:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^#[0-9a-fA-F]{6}$"
    description: "Colores en hex. Debe haber al menos tantos como sources."
  export:
    type: object
    required: [base_dir, registry_file, ids_prefix]
    properties:
      base_dir:
        type: string
        description: "Ruta donde se escriben los HTMLs de export."
      registry_file:
        type: string
        description: "Ruta al archivo YAML del catálogo Jekyll a actualizar."
      ids_prefix:
        type: string
        description: "Prefijo para los ids generados ({prefix}_2d, {prefix}_3d, {prefix}_clusters)."
  example_query:
    type: string
    description: "Query de ejemplo para la celda de query semántica del visualizer."
