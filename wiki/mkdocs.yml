site_name: DeepWiki - Documentación de Repositorios
site_url: http://localhost:8080
site_description: "Wiki autogenerada de repositorios de código indexados con embeddings"

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: es
  # - git-revision-date-localized:
  #     type: date

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Repositorios:
    - "Información": repositorios.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com
  qa_api: "http://localhost:5000"

extra_css:
  - css/extra.css

extra_javascript:
  - js/qa-integration.js
