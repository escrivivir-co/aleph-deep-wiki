version: "3.9"

services:
  # Ollama LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: deepwiki_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - deepwiki
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Si no tienes GPU, comenta la sección deploy de arriba

  # Open WebUI para Ollama
  openui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: deepwiki_openui
    ports:
      - "3000:8080"
    volumes:
      - ./data/openui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=deepwiki-secret-key-2024
      - WEBUI_NAME=DeepWiki AI Chat
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - deepwiki

  # ChromaDB Vector Database
  chroma:
    image: chromadb/chroma:latest
    container_name: deepwiki_chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/chroma/db
    environment:
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/db
      - ANONYMIZED_TELEMETRY=False
    restart: unless-stopped
    networks:
      - deepwiki

  # ETL Service para indexar repositorios
  etl:
    build: ./etl
    container_name: deepwiki_etl
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    volumes:
      - ./repos:/app/repos
      - ./wiki:/app/wiki
    depends_on:
      - chroma
      - ollama
    networks:
      - deepwiki

  # Q&A API Service
  qa:
    build: ./qa
    container_name: deepwiki_qa
    ports:
      - "5000:5000"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    depends_on:
      - chroma
      - ollama
    restart: unless-stopped
    networks:
      - deepwiki

  # MkDocs Wiki
  wiki:
    image: squidfunk/mkdocs-material:latest
    container_name: deepwiki_wiki
    ports:
      - "8080:8000"
    volumes:
      - ./wiki:/docs
      - ./repos:/docs/docs/repos:ro
    command: serve --dev-addr=0.0.0.0:8000
    restart: unless-stopped
    networks:
      - deepwiki

networks:
  deepwiki:
    driver: bridge
